name: Technical SEO validation
on:
  push:
    branches: [technical-seo-phase1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore staged source on the isolated branch
        if: github.ref == 'refs/heads/technical-seo-phase1'
        run: |
          if [ -f technical-seo-source.zip ]; then
            unzip -oq technical-seo-source.zip
            rm technical-seo-source.zip
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node _seo/team-browser-test.cjs
      - run: node _seo/browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-seo-browser-validation
          path: _seo/test-results/
      - name: Save validated static output to the isolated branch
        if: github.ref == 'refs/heads/technical-seo-phase1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Generate and validate static SEO pages without content changes"
            git push origin HEAD:technical-seo-phase1
          fi
